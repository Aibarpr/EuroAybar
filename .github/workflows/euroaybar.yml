name: EuroAybar Auto Publisher

on:
  schedule:
    # Каждые 2 часа на 17-й минуте по UTC.
    # Для Алматы это будет примерно 05:17, 07:17, 09:17, 11:17, 13:17, 15:17, 17:17 и т.д.
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EuroAybar bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MODE: "news"
          DRY_RUN: "false"
        run: python main.py
